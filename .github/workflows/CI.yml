name: Build Debug APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Fetch and patch SharedModules/MediaServiceCore
        run: ./scripts/fetch-deps.sh

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Update Version Name
        id: get_version
        run: |
          # versionCode needs to actually increase between beta builds too, or a device that
          # installed today's beta can't install tomorrow's over it (Android refuses a same-or-lower
          # versionCode "update", same rule release.yml already follows). Suffix range is 00-49,
          # release.yml uses 50-99 for the same day - keeps the two workflows' independent
          # github.run_number sequences from ever landing on the same versionCode on the same date.
          VERSION_CODE="$(date -u +%Y%m%d)$(printf '%02d' $((${{ github.run_number }} % 50)))"
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-nightly-${{ github.run_number }}\"/" smarttubetv/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Configure Build Signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/key.jks
    
      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Lint with Gradle
        run: ./gradlew lintStbetaRelease

      - name: Upload Lint Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn

      - name: Build with Gradle
        run: ./gradlew clean assembleStbetaRelease

      - name: VirusTotal Scan
        if: ${{ env.HAS_VT_KEY == 'true' }}
        id: vt
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: |
            ./smarttubetv/build/outputs/apk/stbeta/release/*.apk
          request_rate: 4

      - name: VirusTotal Summary
        if: steps.vt.outcome == 'success'
        run: |
          echo "Waiting 150s for VirusTotal engines to report..."
          sleep 150

          echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Name | VirusTotal Status | Detailed Report |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          for apk in ./smarttubetv/build/outputs/apk/stbeta/release/*.apk; do
            filename=$(basename "$apk")
            sha256=$(sha256sum "$apk" | awk '{print $1}')

            # Construct the dynamic badge URL using the hash
            badge_url="https://badges.cssnr.com/vt/id/$sha256?start=green&end=red&n=8"
            vt_link="https://www.virustotal.com/gui/file/$sha256"

            echo "| $filename | [![$filename]($badge_url)]($vt_link) | [View Report]($vt_link) |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AetherTube_${{ steps.get_version.outputs.VERSION_NAME }}_arm64
          path: ./smarttubetv/build/outputs/apk/stbeta/release/*_arm64-v8a.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AetherTube_${{ steps.get_version.outputs.VERSION_NAME }}_armeabi-v7a
          path: ./smarttubetv/build/outputs/apk/stbeta/release/*_armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload Universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AetherTube_${{ steps.get_version.outputs.VERSION_NAME }}_universal
          path: ./smarttubetv/build/outputs/apk/stbeta/release/*_universal.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AetherTube_${{ steps.get_version.outputs.VERSION_NAME }}_x86
          path: ./smarttubetv/build/outputs/apk/stbeta/release/*_x86.apk
          if-no-files-found: error

      # Beta needs its own update manifest, exactly like the stable channel's. Beta installs cannot
      # use /releases/latest/download/ - that redirect deliberately skips prereleases, which is what
      # keeps stable users off beta builds - so common/src/stbeta/res/values/update_urls.xml points
      # at this rolling beta-latest tag instead. Without a manifest here the beta app would never
      # see its own updates at all.
      - name: Generate beta update manifest
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          cd smarttubetv/build/outputs/apk/stbeta/release

          # Same exactly-one-match validation as release.yml: an unmatched glob would otherwise be
          # embedded as a literal, broken download URL and only fail much later, on a user's device.
          find_one() {
            local pattern="$1"
            local matches=(./*"$pattern")
            if [ ! -e "${matches[0]}" ]; then
              echo "No file matching *$pattern in $(pwd)" >&2
              exit 1
            fi
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one file matching *$pattern, found ${#matches[@]}: ${matches[*]}" >&2
              exit 1
            fi
            basename "${matches[0]}"
          }

          UNIVERSAL=$(find_one "_universal.apk")
          ARM64=$(find_one "_arm64-v8a.apk")
          ARMV7=$(find_one "_armeabi-v7a.apk")
          X86=$(find_one "_x86.apk")
          cd "${{ github.workspace }}"

          BASE="https://github.com/${{ github.repository }}/releases/download/beta-latest"

          # Beta has no "previous tag" to diff against - beta-latest is a rolling tag that always
          # points at the newest build - so just show the most recent commits.
          CHANGELOG=$(git log --no-merges --pretty=format:'%s' -12 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ -z "$CHANGELOG" ] || [ "$CHANGELOG" = "[]" ]; then
            CHANGELOG='["Continuous beta build."]'
          fi

          jq -n \
            --arg universal "$BASE/$UNIVERSAL" \
            --arg arm64 "$BASE/$ARM64" \
            --arg armv7 "$BASE/$ARMV7" \
            --arg x86 "$BASE/$X86" \
            --arg versionName "${{ steps.get_version.outputs.VERSION_NAME }}" \
            --argjson versionCode "${{ steps.get_version.outputs.VERSION_CODE }}" \
            --argjson changelog "$CHANGELOG" \
            '{
              package: {
                downloadUrl: $universal,
                "downloadUrlList_arm64-v8a": [$arm64],
                "downloadUrlList_armeabi-v7a": [$armv7],
                "downloadUrlList_x86": [$x86]
              }
            } + { ($versionName): { versionCode: $versionCode, changelog: $changelog } }' \
            > update_manifest.json

      # Only runs when signing secrets are configured - an unsigned APK published here would be a
      # broken update chain for anyone who installs it (see release.yml's own reasoning for the
      # same refusal). Rolling tag, not append-only: gh release create errors on a tag that already
      # exists, --clobber only covers re-uploading same-named assets, not recreating the release
      # object itself - delete-then-recreate is the reliable way to keep this a single moving target.
      #
      # No --target: an explicit commit SHA there made GitHub's release list sort this release as
      # the *oldest* on the page instead of the newest, even though its own created_at was the most
      # recent of all releases - the stable releases (created via release.yml, which also omits
      # --target) sorted correctly. Omitting it targets the default branch the same way release.yml
      # already does, which resolves to this exact commit anyway since that's what's checked out.
      - name: Publish Beta Pre-Release
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta-latest --yes --cleanup-tag || true

          gh release create beta-latest \
            ./smarttubetv/build/outputs/apk/stbeta/release/*.apk \
            ./update_manifest.json \
            --title "AetherTube Beta (Latest Commit)" \
            --notes "Continuous build from commit ${{ github.sha }} (run #${{ github.run_number }}). Not a stable release - see the Releases page for those." \
            --prerelease
