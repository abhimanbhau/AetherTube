name: Release

# Builds signed release APKs and publishes them as a GitHub Release. Publishing the release
# also triggers virustotal_scan.yml (it listens for release: published), so scan results land
# on the release notes automatically - no need to duplicate that here.
#
# Requires four repo secrets: SIGNING_KEY (base64 keystore), KEY_STORE_PASSWORD, ALIAS,
# KEY_PASSWORD. Unlike the beta CI build, this workflow refuses to produce an unsigned
# release - an unsigned APK can't be installed as an update over a signed install anyway.
#
# The nightly schedule below is gated on check-for-changes so a quiet night doesn't republish
# identical APKs under a new tag - that's release-notification spam for anyone watching the repo,
# for zero new content. Nightly runs are also tagged/published as --prerelease, which keeps them
# out of GitHub's /releases/latest redirect (see common/src/main/res/values/update_urls.xml) - so
# the in-app updater only ever offers users a deliberately tagged/dispatched release, never an
# unreviewed nightly build.

on:
  push:
    tags: [ "v*" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name for this release (defaults to the tag, or build.gradle's versionName for a manual run)"
        required: false

permissions:
  contents: write

jobs:
  check-for-changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check for commits since the last release tag
        id: changes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag found - proceeding."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(git rev-list "$LAST_TAG"..HEAD --count)
          echo "$COUNT commit(s) since $LAST_TAG"
          echo "has_changes=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    needs: [check-for-changes]
    # needs: on a job that's itself conditionally skipped (schedule-only) would otherwise skip this
    # job too by default on every non-schedule trigger - always() overrides that so tag-push/manual
    # runs are unaffected, and the actual gating is this condition, not the implicit needs check.
    if: always() && (github.event_name != 'schedule' || needs.check-for-changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Refuse to build an unsigned release
        if: ${{ env.HAS_SIGNING_KEY != 'true' }}
        run: |
          echo "SIGNING_KEY (and KEY_STORE_PASSWORD / ALIAS / KEY_PASSWORD) are not set on this repo."
          echo "Add them under Settings -> Secrets and variables -> Actions before running this workflow."
          exit 1

      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Determine version name, code and tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            TAG="v$VERSION_NAME"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION_NAME="${TAG#v}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # build.gradle's versionName only moves when a maintainer bumps it by hand, so reusing
            # it as-is would try to recreate the same tag on the second qualifying night in a row
            # and fail outright (gh release create errors on an existing tag). Suffix with the date
            # to keep every nightly tag unique regardless of how often versionName itself changes.
            BASE_VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')
            VERSION_NAME="${BASE_VERSION_NAME}-nightly.$(date -u +%Y%m%d)"
            TAG="v$VERSION_NAME"
          else
            VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')
            TAG="v$VERSION_NAME"
          fi

          # versionCode drives the actual "is there an update" check on both sides: it's what
          # AppVersionChecker compares, and it's what Android itself refuses to downgrade over an
          # existing install. versionName is cosmetic; this can't be. Date-based so it's always
          # both increasing and larger than the 2397 this fork inherited from upstream - the
          # existing baseline needs no migration, it's just already smaller than any real date.
          #
          # The 2-digit run-number suffix matters: two releases on the same UTC day (a manual
          # re-run to fix something, on top of the automated one) would otherwise share a
          # versionCode, and Android refuses to install an "update" that doesn't strictly increase
          # it. run_number always increases within this workflow, so plain YYYYMMDD + (run_number
          # mod 100) can't collide same-day short of 100 releases in one day.
          #
          # Suffix range is 50-99 here specifically; CI.yml's beta pre-release uses 00-49 for the
          # same formula. github.run_number is a separate counter per workflow file, so without
          # this split a same-day beta build and a same-day tagged/nightly release could otherwise
          # land on the identical versionCode by coincidence.
          VERSION_CODE="$(date -u +%Y%m%d)$(printf '%02d' $((50 + ${{ github.run_number }} % 50)))"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          sed -i "s/versionName \"\(.*\)\"/versionName \"$VERSION_NAME\"/" smarttubetv/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" smarttubetv/build.gradle

      - name: Configure Build Signing
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/key.jks

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build signed release APKs
        run: ./gradlew clean assembleStbetaRelease

      - name: Generate update manifest
        run: |
          cd smarttubetv/build/outputs/apk/stbeta/release

          # An unquoted glob that matches zero files expands to the literal pattern (a garbage
          # filename that then ends up embedded as a real download URL in the manifest); one that
          # matches multiple files passes all of them to basename, which prints multiple lines
          # into what's supposed to be a single filename. Both fail silently downstream instead of
          # here, where the actual problem is. Fail loudly instead - a build producing something
          # other than exactly one APK per ABI is itself a problem worth stopping on.
          find_one() {
            local pattern="$1"
            local matches=(./*"$pattern")
            if [ ! -e "${matches[0]}" ]; then
              echo "No file matching *$pattern in $(pwd)" >&2
              exit 1
            fi
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one file matching *$pattern, found ${#matches[@]}: ${matches[*]}" >&2
              exit 1
            fi
            basename "${matches[0]}"
          }

          UNIVERSAL=$(find_one "_universal.apk")
          ARM64=$(find_one "_arm64-v8a.apk")
          ARMV7=$(find_one "_armeabi-v7a.apk")
          X86=$(find_one "_x86.apk")
          cd "${{ github.workspace }}"

          BASE="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}"

          # Keyed by DeviceHelpers.getPrimaryAbi() - the raw Build.SUPPORTED_ABIS[0] string, which
          # is exactly the arch suffix already in these filenames. AppVersionChecker checks these
          # ABI-specific keys before falling back to the plain downloadUrl (the universal APK).
          jq -n \
            --arg universal "$BASE/$UNIVERSAL" \
            --arg arm64 "$BASE/$ARM64" \
            --arg armv7 "$BASE/$ARMV7" \
            --arg x86 "$BASE/$X86" \
            --arg versionName "${{ steps.version.outputs.VERSION_NAME }}" \
            --argjson versionCode "${{ steps.version.outputs.VERSION_CODE }}" \
            '{
              package: {
                downloadUrl: $universal,
                "downloadUrlList_arm64-v8a": [$arm64],
                "downloadUrlList_armeabi-v7a": [$armv7],
                "downloadUrlList_x86": [$x86]
              }
            } + { ($versionName): { versionCode: $versionCode, changelog: ["Automated release - see the GitHub Release notes for details."] } }' \
            > update_manifest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Nightly builds are marked prerelease so GitHub's /releases/latest redirect - what
          # AppVersionChecker points at - keeps skipping straight past them to the last deliberately
          # tagged/dispatched release. They're still fully public on the Releases page for anyone
          # who wants one on purpose.
          PRERELEASE_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${{ steps.version.outputs.TAG }}" \
            ./smarttubetv/build/outputs/apk/stbeta/release/*.apk \
            ./update_manifest.json \
            --title "AetherTube ${{ steps.version.outputs.VERSION_NAME }}" \
            --generate-notes \
            $PRERELEASE_FLAG
