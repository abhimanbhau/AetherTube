## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ---------------------------------------------------------------------------------------------
# Daemon memory
#
# This was -Xmx2048M for both daemons, which is where most of the build time was going: a Compose
# multi-module build does not fit in 2 GB, so both JVMs spent their time in GC rather than
# compiling. Sized here for a 32 GB machine with Android Studio also running (~4 GB), leaving
# well over half the machine free.
#
# Bigger is not automatically better - past the working set, a larger heap just means longer
# collections - so these are "comfortably more than needed", not "as much as will fit".
#
# ParallelGC over the JDK default G1: build daemons are throughput jobs with no latency
# requirement, which is exactly the workload ParallelGC is better at. Gradle's own performance
# guide recommends it for this reason.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# The modern way to size the Kotlin daemon. Previously this was smuggled in through
# -Dkotlin.daemon.jvm.options inside org.gradle.jvmargs above; setting both would conflict.
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC

# ---------------------------------------------------------------------------------------------
# Execution
#
# parallel: this build has a dozen modules with a wide dependency graph (exoplayer, leanback,
# MediaServiceCore, SharedModules), so there is real work to overlap.
# caching: the local build cache turns re-builds of unchanged modules into cache hits, which is
# what makes switching branches or building a second variant cheap.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# The configuration cache is the single biggest win here: it takes a no-op build from ~6s to ~1s,
# which matters because that is the most frequent operation of all (every Android Studio sync,
# every re-run, every up-to-date check).
#
# smarttubetv/build.gradle uses the legacy applicationVariants.all { } API for APK naming, which
# is deprecated - but AGP 8.13 keeps it configuration-cache compatible, verified by building both
# stbetaDebug and stbetaRelease with the cache enabled and confirming the APK names still come
# out right. If a future AGP drops that compatibility, migrate the block to the new Variant API
# rather than turning this off.
org.gradle.configuration-cache=true

# Deliberately NOT set:
#
#   org.gradle.configuration-cache.problems=warn - actively dangerous. It downgrades cache
#     correctness failures to warnings and stores the entry anyway, so you get a build that is
#     fast and quietly wrong. Left at the default (fail) so problems stay visible; there are
#     currently none.
#
#   org.gradle.configureondemand - deprecated in Gradle 9, and Gradle explicitly advises against
#     combining it with the configuration cache, which supersedes it. Historically a source of
#     subtle "task didn't run" bugs in multi-module builds.

# ---------------------------------------------------------------------------------------------
# Android
android.useAndroidX=true

# Jetifier has to stay on, despite the common advice to drop it.
#
# `gradlew checkJetifier` reports every module clean except a com.52inc:52Kit-core ->
# com.android.support:appcompat-v7 edge in :slidableactivity's androidTest classpath, which looks
# ignorable - but that task only inspects a subset of configurations. Turning it off actually
# fails the build at :smarttubetv:processStbetaDebugMainManifest, where
# com.android.support:support-compat:28.0.0 reaches the merged manifest and collides with
# androidx.core over appComponentFactory. So the legacy support library is genuinely on the
# runtime classpath and Jetifier is genuinely doing work.
#
# Worth revisiting only by removing the 52Kit dependency from :slidableactivity; until then this
# costs a bytecode rewrite of every dependency and cannot be avoided.
android.enableJetifier=true
android.jetifier.ignorelist=bcprov

# nonTransitiveRClass stays false on purpose - upstream code references R fields across module
# boundaries and turning it on breaks compilation. It does cost build time (every module gets a
# transitive R class generated), so it is worth revisiting if that upstream code is ever reworked.
android.nonTransitiveRClass=false

android.suppressUnsupportedCompileSdk=34

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
